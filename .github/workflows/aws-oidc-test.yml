name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    name: Verify temporary AWS identity
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect safe OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`issuer: ${payload.iss}`);
            core.info(`audience: ${payload.aud}`);
            core.info(`subject: ${payload.sub}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_id: ${payload.repository_id}`);
            core.info(`repository_owner: ${payload.repository_owner}`);
            core.info(`repository_owner_id: ${payload.repository_owner_id}`);

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Display assumed AWS identity
        run: aws sts get-caller-identity
